      #brand-splash .wordmark {
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
        transform: translateY(8px);
        animation: splash-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;

        height: auto;

        width: 0;

        animation: splash-rule 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;

        to { opacity: 1; transform: translateY(0); }
      }

        to { width: 2.75rem; }

        #brand-splash, #brand-splash .wordmark { transition: none; }
