      #brand-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c221e;
        opacity: 1;
        transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #brand-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      #brand-splash .wordmark {
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
        transform: translateY(8px);
        animation: splash-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
        transition: opacity 0.35s ease, transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #brand-splash.is-leaving .wordmark {
        opacity: 0;
        transform: translateY(-6px) scale(1.03);
      }
      #brand-splash .wordmark-svg {
        width: clamp(230px, 44vw, 400px);
        height: auto;
        display: block;
      }
      #brand-splash .rule {
        display: block;
        margin-top: 1.1rem;
        width: 0;
        height: 1px;
        background: rgba(194, 164, 109, 0.8);
        animation: splash-rule 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
      }
      @keyframes splash-in {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-rule {
        to { width: 2.75rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        #brand-splash, #brand-splash .wordmark { transition: none; }
        #brand-splash .wordmark { animation: none; opacity: 1; transform: none; }
        #brand-splash .rule { animation: none; width: 2.75rem; }
      }
    </style>
