      #brand-splash .wordmark {
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
        transform: translateY(8px);
        animation: splash-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;

        transform: translateY(-6px) scale(1.03);
      }
      #brand-splash .wordmark-svg {
        width: clamp(200px, 32vw, 340px);
        height: auto;
        display: block;
      }
      #brand-splash .rule {
        display: block;
        margin-top: 1.1rem;
        width: 0;
        height: 1px;
        background: rgba(194, 164, 109, 0.8);
        animation: splash-rule 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
      }
      @keyframes splash-in {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-rule {
        to { width: 2.75rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        #brand-splash, #brand-splash .wordmark { transition: none; }
        #brand-splash .wordmark { animation: none; opacity: 1; transform: none; }
        #brand-splash .rule { animation: none; width: 2.75rem; }
      }
